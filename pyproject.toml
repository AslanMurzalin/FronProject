[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-baiting-analyzer"
version = "0.1.0"
description = "CS2 FACEIT Baiting Analyzer - Evidence-first tactical demo analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "demoparser2>=0.42.0",
    "polars>=1.17.0",
    "numpy>=2.0.0",
    "zstandard>=0.23.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
